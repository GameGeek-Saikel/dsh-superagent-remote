<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">DSH Superagent Remote</title>
  <desc id="desc">One dsh-superagent deployment per GitHub project inside WSL2, managed from the DeepSeek Harness web panel with a native conversation and a project pane.</desc>
