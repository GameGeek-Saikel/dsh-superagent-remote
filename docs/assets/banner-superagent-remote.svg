    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59b8ff"/>
      <stop offset="1" stop-color="#48e0b0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#59b8ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#59b8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb6d9" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
